name: News Digest

on:
  schedule:
    # Checks every hour. The update time itself is set in config.toml.
    - cron: "7 * * * *"
  workflow_dispatch:  # the "Run workflow" button: update the news page now

permissions:
  contents: write

concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Is it time to update?
        id: gate
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 -m newsdigest.gate >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Build the news update
        if: steps.gate.outputs.run == 'true'
        env:
          PYTHONUNBUFFERED: "1"  # show progress in the log as it happens
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m newsdigest

      - name: Publish to the news page
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "News for $(TZ=Australia/Perth date '+%F %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
