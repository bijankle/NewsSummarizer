name: News Digest

# Runs only when asked, from the app's buttons (or Actions, Run workflow).
# There is no schedule, so the AI is used only when you want it.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "update: collect and summarise new stories. factcheck: check one story. weekly: write the week in review."
        type: choice
        options: ["update", "factcheck", "weekly"]
        default: "update"
      story_file:
        description: "factcheck only: edition file, e.g. digests/2026-09-27-0744.json"
        default: ""
      story_id:
        description: "factcheck only: story id in that file, e.g. s3"
        default: ""
      story_key:
        description: "factcheck only: the app's key for the story"
        default: ""

permissions:
  contents: write

concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the ${{ inputs.task }} task
        env:
          PYTHONUNBUFFERED: "1"  # show progress in the log as it happens
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TASK: ${{ inputs.task }}
          STORY_FILE: ${{ inputs.story_file }}
          STORY_ID: ${{ inputs.story_id }}
          STORY_KEY: ${{ inputs.story_key }}
        run: |
          case "$TASK" in
            factcheck) python -m newsdigest.factcheck --file "$STORY_FILE" --id "$STORY_ID" --key "$STORY_KEY" ;;
            weekly)    python -m newsdigest.weekly ;;
            *)         python -m newsdigest ;;
          esac

      - name: Publish to the news page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "News ${{ inputs.task }} $(TZ=Australia/Perth date '+%F %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
